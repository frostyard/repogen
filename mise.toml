# Tool pins for this repository (core ADR-0043). Go comes from go.mod: never
# pin it here. Every tool the gates invoke beyond the worker base image is
# listed; mise.lock carries the checksums. `mise install` provisions the same
# versions locally and in CI.
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
golangci-lint = "2.15.0"
node = "24.22.2"
svu = "3.4.1"
