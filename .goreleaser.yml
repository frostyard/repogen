version: 2

builds:
  - id: repogen
    main: ./cmd/repogen
    binary: repogen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/frostyard/repogen/internal/buildinfo.Version={{ .Version }}
      - -X github.com/frostyard/repogen/internal/buildinfo.Commit={{ .FullCommit }}

archives:
  - id: repogen
    formats:
      - binary
    name_template: "repogen-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: frostyard
    name: repogen
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
