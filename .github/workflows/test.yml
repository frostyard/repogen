name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        # `go install pkg@version` builds outside this module, so it uses the
        # setup-go Go (the go.mod `go` line). Force the go.mod `toolchain` so
        # the linter is built with the same Go it targets.
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.3.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run linter
        run: make lint

      - name: Run unit tests
        run: go test -v -short -race -coverprofile=coverage.txt ./...

      - name: Build test packages
        run: make test-packages-docker

      - name: Run integration tests
        run: make test-integration

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: success()
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  docs-gate:
    name: Docs integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check docs index, links, and conformance aliases
        run: node scripts/check-docs.mjs
