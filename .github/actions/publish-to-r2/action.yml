name: 'Publish Packages to Repogen R2 Repository'
description: 'Add .deb or sysext packages to an existing repogen repository hosted on Cloudflare R2'
author: 'frostyard'

branding:
  icon: 'package'
  color: 'orange'

inputs:
  # Cloudflare R2 credentials
  r2-account-id:
    description: 'Cloudflare R2 Account ID'
    required: true
  r2-access-key-id:
    description: 'Cloudflare R2 Access Key ID'
    required: true
  r2-secret-access-key:
    description: 'Cloudflare R2 Secret Access Key'
    required: true
  r2-bucket:
    description: 'Cloudflare R2 Bucket name'
    required: true

  # Package inputs
  packages-dir:
    description: 'Directory containing packages to add (.deb, .raw, .raw.zst, etc.)'
    required: true
  package-type:
    description: 'Type of packages: deb, sysext, rpm, apk, pacman, homebrew'
    required: true

  # Repository configuration
  base-url:
    description: 'Base URL where the repository will be accessible (required for sysext)'
    required: false
    default: ''
  repo-prefix:
    description: 'Prefix path in R2 bucket (e.g., "repo" for s3://bucket/repo/)'
    required: false
    default: ''

  # Signing (optional)
  gpg-private-key:
    description: 'GPG private key for signing (base64 encoded or ASCII armored)'
    required: false
    default: ''
  gpg-passphrase:
    description: 'GPG key passphrase'
    required: false
    default: ''
  rsa-private-key:
    description: 'RSA private key for Alpine signing (PEM format)'
    required: false
    default: ''
  rsa-passphrase:
    description: 'RSA key passphrase'
    required: false
    default: ''
  rsa-key-name:
    description: 'Key name for Alpine signatures'
    required: false
    default: 'repogen'

  # Debian-specific options
  codename:
    description: 'Codename for Debian repos (e.g., stable, bookworm)'
    required: false
    default: 'stable'
  suite:
    description: 'Suite for Debian repos (defaults to codename)'
    required: false
    default: ''
  components:
    description: 'Components for Debian repos (comma-separated)'
    required: false
    default: 'main'
  architectures:
    description: 'Architectures to support (comma-separated)'
    required: false
    default: 'all,amd64'

  # Repository metadata
  origin:
    description: 'Repository origin name'
    required: false
    default: ''
  label:
    description: 'Repository label'
    required: false
    default: 'Frostyard Repository'
  repo-name:
    description: 'Repository name (required for Pacman)'
    required: false
    default: ''

  # RPM-specific options
  distro-variant:
    description: 'Distribution variant for RPM repos (fedora, centos, rhel)'
    required: false
    default: 'fedora'
  version:
    description: 'Release version for RPM repos (e.g., 40 for Fedora 40)'
    required: false
    default: ''

  # Repogen version
  repogen-version:
    description: 'Version of repogen to use (e.g., v0.1.0, or "latest")'
    required: false
    default: 'latest'

outputs:
  packages-added:
    description: 'Number of packages added to the repository'
    value: ${{ steps.run-repogen.outputs.packages-added }}

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        set -e
        echo "::group::Validating inputs"

        # Validate package type
        case "${{ inputs.package-type }}" in
          deb|sysext|rpm|apk|pacman|homebrew)
            echo "✓ Package type: ${{ inputs.package-type }}"
            ;;
          *)
            echo "::error::Invalid package-type '${{ inputs.package-type }}'. Must be one of: deb, sysext, rpm, apk, pacman, homebrew"
            exit 1
            ;;
        esac

        # Validate base-url is provided for sysext
        if [[ "${{ inputs.package-type }}" == "sysext" && -z "${{ inputs.base-url }}" ]]; then
          echo "::error::base-url is required for sysext package type"
          exit 1
        fi
        echo "✓ base-url: ${{ inputs.base-url }}"

        # Validate repo-name is provided for pacman
        if [[ "${{ inputs.package-type }}" == "pacman" && -z "${{ inputs.repo-name }}" ]]; then
          echo "::error::repo-name is required for pacman package type"
          exit 1
        fi

        # Validate packages directory exists
        if [[ ! -d "${{ inputs.packages-dir }}" ]]; then
          echo "::error::packages-dir does not exist: ${{ inputs.packages-dir }}"
          echo "Current directory contents:"
          ls -la
          exit 1
        fi
        echo "✓ packages-dir exists: ${{ inputs.packages-dir }}"

        # List contents of packages directory for debugging
        echo ""
        echo "Contents of ${{ inputs.packages-dir }}:"
        find "${{ inputs.packages-dir }}" -type f -name "*.raw*" -o -name "*.deb" -o -name "*.rpm" -o -name "*.apk" -o -name "*.pkg.tar.*" -o -name "*.bottle.tar.gz" 2>/dev/null | head -20 || echo "  (no matching package files found)"
        echo ""

        echo "::endgroup::"

    - name: Install repogen
      shell: bash
      run: |
        set -e
        echo "::group::Installing repogen"

        REPOGEN_VERSION="${{ inputs.repogen-version }}"

        if [[ "$REPOGEN_VERSION" == "latest" ]]; then
          # Get latest release
          echo "Fetching latest release version..."
          RELEASE_INFO=$(curl -sS https://api.github.com/repos/frostyard/repogen/releases/latest)
          REPOGEN_VERSION=$(echo "$RELEASE_INFO" | jq -r .tag_name)

          if [[ -z "$REPOGEN_VERSION" || "$REPOGEN_VERSION" == "null" ]]; then
            echo "::error::Could not determine latest repogen version. API response:"
            echo "$RELEASE_INFO" | head -20
            exit 1
          fi
        fi

        echo "Installing repogen $REPOGEN_VERSION..."

        # Detect architecture
        ARCH=$(uname -m)
        case "$ARCH" in
          x86_64) ARCH="amd64" ;;
          aarch64) ARCH="arm64" ;;
        esac
        echo "Detected architecture: $ARCH"

        # Download repogen
        DOWNLOAD_URL="https://github.com/frostyard/repogen/releases/download/${REPOGEN_VERSION}/repogen-linux-${ARCH}"
        echo "Downloading from: $DOWNLOAD_URL"

        HTTP_CODE=$(curl -sS -L -w "%{http_code}" -o /tmp/repogen "$DOWNLOAD_URL")
        if [[ "$HTTP_CODE" != "200" ]]; then
          echo "::error::Failed to download repogen (HTTP $HTTP_CODE)"
          echo "URL: $DOWNLOAD_URL"
          exit 1
        fi

        chmod +x /tmp/repogen

        # Verify installation
        echo "Verifying installation..."
        /tmp/repogen --version || /tmp/repogen --help > /dev/null
        echo "✓ repogen installed successfully"

        echo "::endgroup::"

    - name: Configure AWS CLI for R2
      shell: bash
      run: |
        set -e
        echo "::group::Configuring AWS CLI for R2"

        # Configure AWS CLI to use R2
        aws configure set aws_access_key_id "${{ inputs.r2-access-key-id }}"
        aws configure set aws_secret_access_key "${{ inputs.r2-secret-access-key }}"
        aws configure set default.region auto

        # Set R2 endpoint
        R2_ENDPOINT="https://${{ inputs.r2-account-id }}.r2.cloudflarestorage.com"
        echo "R2_ENDPOINT=$R2_ENDPOINT" >> $GITHUB_ENV
        echo "✓ R2 endpoint configured: $R2_ENDPOINT"
        echo "✓ Bucket: ${{ inputs.r2-bucket }}"

        echo "::endgroup::"

    - name: Sync existing repository from R2
      shell: bash
      run: |
        set -e
        echo "::group::Syncing existing metadata from R2"

        BUCKET="${{ inputs.r2-bucket }}"
        PREFIX="${{ inputs.repo-prefix }}"
        PACKAGE_TYPE="${{ inputs.package-type }}"

        # Create local repo directory
        mkdir -p repo

        # Build S3 path
        if [[ -n "$PREFIX" ]]; then
          S3_PATH="s3://${BUCKET}/${PREFIX}"
        else
          S3_PATH="s3://${BUCKET}"
        fi

        echo "S3 path: $S3_PATH"
        echo "Package type: $PACKAGE_TYPE"

        # Sync only metadata files based on package type
        # We don't need to sync the actual packages, just the metadata for incremental mode
        case "$PACKAGE_TYPE" in
          deb)
            # Sync dists directory (metadata)
            echo "Syncing dists directory..."
            aws s3 sync "${S3_PATH}/dists" "./repo/dists" \
              --endpoint-url "$R2_ENDPOINT" \
              --delete \
              2>&1 || echo "No existing dists directory found (this is OK for first run)"
            ;;
          sysext)
            # Sync ext directory, excluding actual extension files
            echo "Syncing ext directory (metadata only)..."
            aws s3 sync "${S3_PATH}/ext" "./repo/ext" \
              --endpoint-url "$R2_ENDPOINT" \
              --exclude "*.raw" \
              --exclude "*.raw.zst" \
              --exclude "*.raw.xz" \
              --exclude "*.raw.gz" \
              2>&1 || echo "No existing ext directory found (this is OK for first run)"
            ;;
          rpm)
            # Sync repodata directory
            VERSION="${{ inputs.version }}"
            if [[ -n "$VERSION" ]]; then
              aws s3 sync "${S3_PATH}/${VERSION}/x86_64/repodata" "./repo/${VERSION}/x86_64/repodata" \
                --endpoint-url "$R2_ENDPOINT" \
                --delete \
                2>/dev/null || echo "No existing repodata directory found"
            else
              aws s3 sync "${S3_PATH}" "./repo" \
                --endpoint-url "$R2_ENDPOINT" \
                --exclude "*.rpm" \
                2>/dev/null || echo "No existing repository found"
            fi
            ;;
          apk)
            # Sync APKINDEX files
            aws s3 sync "${S3_PATH}" "./repo" \
              --endpoint-url "$R2_ENDPOINT" \
              --exclude "*.apk" \
              2>/dev/null || echo "No existing repository found"
            ;;
          pacman)
            # Sync database files only
            ARCHES="${{ inputs.architectures }}"
            IFS=',' read -ra ARCH_ARRAY <<< "$ARCHES"
            for arch in "${ARCH_ARRAY[@]}"; do
              arch=$(echo "$arch" | tr -d ' ')
              aws s3 sync "${S3_PATH}/${arch}" "./repo/${arch}" \
                --endpoint-url "$R2_ENDPOINT" \
                --exclude "*.pkg.tar.zst" \
                --exclude "*.pkg.tar.xz" \
                --exclude "*.pkg.tar.gz" \
                --exclude "*.pkg.tar.zst.sig" \
                --exclude "*.pkg.tar.xz.sig" \
                --exclude "*.pkg.tar.gz.sig" \
                2>&1 || echo "No existing repository found for $arch (this is OK for first run)"
            done
            ;;
          homebrew)
            # Sync Formula directory
            echo "Syncing Formula directory..."
            aws s3 sync "${S3_PATH}/Formula" "./repo/Formula" \
              --endpoint-url "$R2_ENDPOINT" \
              --delete \
              2>&1 || echo "No existing Formula directory found (this is OK for first run)"
            ;;
        esac

        echo ""
        echo "Local repo directory contents:"
        find ./repo -type f 2>/dev/null | head -20 || echo "  (empty)"
        echo ""
        echo "✓ Metadata sync complete"
        echo "::endgroup::"

    - name: Prepare signing keys
      shell: bash
      env:
        GPG_PRIVATE_KEY: ${{ inputs.gpg-private-key }}
        RSA_PRIVATE_KEY: ${{ inputs.rsa-private-key }}
      run: |
        set -e
        echo "::group::Preparing signing keys"

        # Prepare GPG key if provided
        if [[ -n "$GPG_PRIVATE_KEY" ]]; then
          echo "Preparing GPG key..."

          # Check if it's base64 encoded or plain ASCII armor
          if echo "$GPG_PRIVATE_KEY" | head -1 | grep -q "BEGIN PGP"; then
            echo "Detected ASCII-armored GPG key"
            echo "$GPG_PRIVATE_KEY" > /tmp/gpg-key.asc
          else
            echo "Detected base64-encoded GPG key, decoding..."
            echo "$GPG_PRIVATE_KEY" | base64 -d > /tmp/gpg-key.asc
          fi

          # Verify the key looks valid
          if head -1 /tmp/gpg-key.asc | grep -q "BEGIN PGP"; then
            echo "✓ GPG key prepared successfully"
            echo "GPG_KEY_PATH=/tmp/gpg-key.asc" >> $GITHUB_ENV
          else
            echo "::warning::GPG key does not appear to be valid PGP format"
            echo "First line: $(head -1 /tmp/gpg-key.asc | cut -c1-40)..."
          fi
        else
          echo "No GPG key provided, skipping"
        fi

        # Prepare RSA key if provided
        if [[ -n "$RSA_PRIVATE_KEY" ]]; then
          echo "Preparing RSA key..."

          # Check if it's base64 encoded or plain PEM
          if echo "$RSA_PRIVATE_KEY" | head -1 | grep -q "BEGIN"; then
            echo "Detected PEM-formatted RSA key"
            echo "$RSA_PRIVATE_KEY" > /tmp/rsa-key.pem
          else
            echo "Detected base64-encoded RSA key, decoding..."
            echo "$RSA_PRIVATE_KEY" | base64 -d > /tmp/rsa-key.pem
          fi

          chmod 600 /tmp/rsa-key.pem
          echo "✓ RSA key prepared successfully"
          echo "RSA_KEY_PATH=/tmp/rsa-key.pem" >> $GITHUB_ENV
        else
          echo "No RSA key provided, skipping"
        fi

        echo "::endgroup::"

    - name: Run repogen
      id: run-repogen
      shell: bash
      run: |
        set -e
        echo "::group::Running repogen"

        # List all files in input directory for debugging
        echo "All files in ${{ inputs.packages-dir }}:"
        find "${{ inputs.packages-dir }}" -type f 2>/dev/null | head -50 || echo "  (empty or not accessible)"
        echo ""

        # Count packages with detailed output
        echo "Searching for packages..."
        PACKAGE_FILES=$(find "${{ inputs.packages-dir }}" -type f \( \
          -name "*.deb" -o \
          -name "*.rpm" -o \
          -name "*.apk" -o \
          -name "*.pkg.tar.zst" -o \
          -name "*.pkg.tar.xz" -o \
          -name "*.pkg.tar.gz" -o \
          -name "*.raw" -o \
          -name "*.raw.zst" -o \
          -name "*.raw.xz" -o \
          -name "*.raw.gz" -o \
          -name "*.bottle.tar.gz" \
        \) 2>/dev/null || true)

        if [[ -n "$PACKAGE_FILES" ]]; then
          echo "Found packages:"
          echo "$PACKAGE_FILES"
          PACKAGE_COUNT=$(echo "$PACKAGE_FILES" | wc -l)
        else
          PACKAGE_COUNT=0
        fi

        echo ""
        echo "Total packages found: $PACKAGE_COUNT"
        echo "packages-added=$PACKAGE_COUNT" >> $GITHUB_OUTPUT

        if [[ "$PACKAGE_COUNT" -eq 0 ]]; then
          echo "::error::No packages found in ${{ inputs.packages-dir }}"
          echo "Expected file extensions: .deb, .rpm, .apk, .pkg.tar.zst, .pkg.tar.xz, .pkg.tar.gz, .raw, .raw.zst, .raw.xz, .raw.gz, .bottle.tar.gz"
          exit 1
        fi

        # Build repogen command as array for safer execution
        REPOGEN_ARGS=("generate")
        REPOGEN_ARGS+=("--input-dir" "${{ inputs.packages-dir }}")
        REPOGEN_ARGS+=("--output-dir" "./repo")
        REPOGEN_ARGS+=("--incremental")
        REPOGEN_ARGS+=("-v")

        # Add base-url if provided
        if [[ -n "${{ inputs.base-url }}" ]]; then
          REPOGEN_ARGS+=("--base-url" "${{ inputs.base-url }}")
        fi

        # Add Debian options
        if [[ -n "${{ inputs.codename }}" ]]; then
          REPOGEN_ARGS+=("--codename" "${{ inputs.codename }}")
        fi
        if [[ -n "${{ inputs.suite }}" ]]; then
          REPOGEN_ARGS+=("--suite" "${{ inputs.suite }}")
        fi
        if [[ -n "${{ inputs.components }}" ]]; then
          REPOGEN_ARGS+=("--components" "${{ inputs.components }}")
        fi
        if [[ -n "${{ inputs.architectures }}" ]]; then
          REPOGEN_ARGS+=("--arch" "${{ inputs.architectures }}")
        fi

        # Add metadata options
        if [[ -n "${{ inputs.origin }}" ]]; then
          REPOGEN_ARGS+=("--origin" "${{ inputs.origin }}")
        fi
        if [[ -n "${{ inputs.label }}" ]]; then
          REPOGEN_ARGS+=("--label" "${{ inputs.label }}")
        fi
        if [[ -n "${{ inputs.repo-name }}" ]]; then
          REPOGEN_ARGS+=("--repo-name" "${{ inputs.repo-name }}")
        fi

        # Add RPM options
        if [[ -n "${{ inputs.distro-variant }}" ]]; then
          REPOGEN_ARGS+=("--distro" "${{ inputs.distro-variant }}")
        fi
        if [[ -n "${{ inputs.version }}" ]]; then
          REPOGEN_ARGS+=("--version" "${{ inputs.version }}")
        fi

        # Add signing options
        if [[ -n "${GPG_KEY_PATH:-}" ]]; then
          REPOGEN_ARGS+=("--gpg-key" "${GPG_KEY_PATH}")
          if [[ -n "${{ inputs.gpg-passphrase }}" ]]; then
            REPOGEN_ARGS+=("--gpg-passphrase" "${{ inputs.gpg-passphrase }}")
          fi
        fi

        if [[ -n "${RSA_KEY_PATH:-}" ]]; then
          REPOGEN_ARGS+=("--rsa-key" "${RSA_KEY_PATH}")
          if [[ -n "${{ inputs.rsa-passphrase }}" ]]; then
            REPOGEN_ARGS+=("--rsa-passphrase" "${{ inputs.rsa-passphrase }}")
          fi
          REPOGEN_ARGS+=("--key-name" "${{ inputs.rsa-key-name }}")
        fi

        echo "Running: /tmp/repogen ${REPOGEN_ARGS[*]}"
        /tmp/repogen "${REPOGEN_ARGS[@]}"

        echo ""
        echo "✓ repogen completed successfully"
        echo "::endgroup::"

    - name: Upload repository to R2
      shell: bash
      run: |
        set -e
        echo "::group::Uploading repository to R2"

        BUCKET="${{ inputs.r2-bucket }}"
        PREFIX="${{ inputs.repo-prefix }}"

        # Build S3 path
        if [[ -n "$PREFIX" ]]; then
          S3_PATH="s3://${BUCKET}/${PREFIX}"
        else
          S3_PATH="s3://${BUCKET}"
        fi

        echo "Target: $S3_PATH"
        echo ""
        echo "Files to upload:"
        find ./repo -type f | head -50
        echo ""

        echo "Uploading repository to R2..."

        # Sync repository to R2
        # Note: We don't use --delete to preserve existing packages that aren't local
        aws s3 sync "./repo" "${S3_PATH}" \
          --endpoint-url "$R2_ENDPOINT"

        echo ""
        echo "✓ Repository uploaded successfully to ${S3_PATH}"
        echo "::endgroup::"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        echo "::group::Cleanup"
        # Clean up sensitive files
        rm -f /tmp/gpg-key.asc /tmp/rsa-key.pem /tmp/repogen

        # Clear AWS credentials
        aws configure set aws_access_key_id ""
        aws configure set aws_secret_access_key ""
        echo "✓ Cleanup complete"
        echo "::endgroup::"
